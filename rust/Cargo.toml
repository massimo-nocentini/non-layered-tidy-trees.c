[package]
name = "non-layered-tidy-trees"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"
license = "MIT"
description = "Drawing non-layered tidy trees in linear time (van der Ploeg, 2014), a port of the C implementation"
repository = "https://github.com/massimo-nocentini/non-layered-tidy-trees.c"
readme = "README.md"
keywords = ["tree", "layout", "drawing", "tidy"]
categories = ["algorithms", "visualization"]

[features]
# Explicit AVX2 kernels for the elementwise sweeps of `flat`, with runtime detection.
# Off by default: it is the only `unsafe` in the crate, and `simd-plan.md` explains why
# the win is small. `cargo bench`-style comparison lives in `src/bin/bench.rs`.
simd = []

[dependencies]

[profile.test]
opt-level = 1
